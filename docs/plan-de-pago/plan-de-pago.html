<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan de pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pt:#0E3B3E;--pt2:#17565A;--bone:#F1EEE8;--paper:#fff;--ink:#12211F;
--mut:#71827F;--line:#DBD7CF;--coral:#C2482F;--ok:#2E7D5B;--amber:#C8891B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bone);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:15px}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-family:'Archivo Narrow';font-size:19px;margin:0;text-transform:uppercase;letter-spacing:.03em}
#who{font-size:13px;color:var(--mut);flex:1}
button{font-family:'Archivo';font-weight:600;cursor:pointer;border-radius:7px;border:1px solid transparent}
.b2{background:var(--paper);border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-size:13px}
.b2:hover{border-color:var(--pt)}

#load{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;cursor:pointer;margin-bottom:14px}
#load:hover,#load.on{border-color:var(--pt);background:#F7FBFA}
#load b{font-family:'Archivo Narrow';font-size:19px;display:block}
#load span{font-size:13px;color:var(--mut)}

.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:10px 8px;font-size:13.5px;background:transparent;color:var(--mut);border-radius:6px}
.seg button.on{background:var(--pt);color:#fff}

.ctr{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--paper);
 border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.f{flex:1;min-width:104px}
.f label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:3px}
.f input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;
 font-family:'Archivo Narrow';font-size:17px;font-variant-numeric:tabular-nums}
.f input:focus{outline:2px solid var(--pt2);outline-offset:-1px}
.f input.auto{background:#F5F8F7;color:var(--pt)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;align-items:stretch}
.col{background:var(--paper);border:1px solid var(--line);border-radius:10px;
 display:flex;flex-direction:column;min-height:132px;transition:.12s}
.col.hot{border-color:var(--pt);background:#F5FAF9;box-shadow:0 0 0 3px rgba(23,86,90,.10)}
.ch{padding:8px 10px 7px;border-bottom:1px solid var(--line)}
.ch .m{font-family:'Archivo Narrow';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ch .t{font-family:'Archivo Narrow';font-size:20px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:1px}
.ch .t.zero{color:var(--line)} .ch .t.hi{color:var(--coral)}
.ch .k{font-size:10.5px;color:var(--mut);letter-spacing:.04em}
.body{padding:7px;display:flex;flex-direction:column;gap:5px;flex:1}
.chip{background:var(--bone);border-radius:7px;padding:6px 7px;font-size:11.8px;line-height:1.3;
 display:flex;align-items:center;gap:6px;cursor:grab;border:1px solid transparent}
.chip.drag{opacity:.35}
.chip .nm{flex:1;min-width:0}
.chip .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .nm i{font-style:normal;font-family:'Archivo Narrow';color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.chip .ar{display:flex;gap:1px}
.chip .ar button{width:21px;height:23px;background:var(--paper);border:1px solid var(--line);
 font-size:13px;line-height:1;color:var(--pt);padding:0;border-radius:5px}
.chip .ar button:hover{background:var(--pt);color:#fff;border-color:var(--pt)}
.st{margin-top:auto;padding:7px 9px;border-radius:8px;font-size:11.5px;font-family:'Archivo Narrow';
 display:flex;justify-content:space-between;gap:6px;letter-spacing:.02em}
.st.ok{background:#E9F4EE;color:#1C523B}
.st.bad{background:#FBEDEA;color:#7A2A18}
.empty{color:var(--line);font-size:12px;text-align:center;padding:14px 0;font-style:italic}
.mm{display:flex;gap:8px;margin-top:10px;align-items:center}
.mm button{width:38px;height:34px;background:var(--paper);border:1px solid var(--line);
 color:var(--pt);font-size:19px;line-height:1;border-radius:8px}
.mm button:hover:not(:disabled){background:var(--pt);color:#fff;border-color:var(--pt)}
.mm button:disabled{opacity:.35;cursor:not-allowed}
.mm span{font-size:12.5px;color:var(--mut)}

.say{background:var(--pt);color:#fff;border-radius:12px;padding:17px 19px;margin-top:14px}
.say p{margin:0;font-size:17px;line-height:1.5}
.say b{font-family:'Archivo Narrow';font-size:21px}
.say .sub{font-size:13px;opacity:.82;margin-top:9px;line-height:1.65}
.warn{background:#FBEDEA;color:#7A2A18;border-left:3px solid var(--coral);padding:10px 13px;border-radius:7px;font-size:13.5px;margin-top:10px}
.info{background:#FDF4E3;color:#6E4C0C;border-left:3px solid var(--amber);padding:10px 13px;border-radius:7px;font-size:13.5px;margin-top:10px}
@media print{
 @page{size:A4 landscape;margin:7mm}
 .np{display:none!important}
 body{background:#fff;font-size:9pt}
 .wrap{padding:0;max-width:none}
 .top{margin-bottom:5mm}.top h1{font-size:14pt}
 .board{grid-template-columns:repeat(6,1fr);gap:3mm}
 .col{min-height:0;break-inside:avoid;border-color:#bbb}
 .ch{padding:5px 7px}.ch .t{font-size:13pt}.ch .m{font-size:7pt}.ch .k{font-size:6.5pt}
 .body{padding:5px;gap:3px}
 .chip{font-size:7.5pt;padding:4px 5px;background:#f2efe9}
 .chip .ar{display:none}
 .chip .nm i{font-size:7pt}
 .st{font-size:7pt;padding:4px 6px}
 .empty{display:none}
 .say{margin-top:4mm;padding:4mm;background:#0E3B3E!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .say p{font-size:11pt}.say b{font-size:13pt}.say .sub{font-size:8pt}
 .warn,.info{font-size:8pt;padding:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <h1>Plan de pago</h1>
  <span id="who"></span>
  <button class="b2 np" id="reload" style="display:none">Otro presupuesto</button>
  <button class="b2 np" id="print" style="display:none">Imprimir</button>
</div>

<div id="load" class="np"><b>Soltá el PDF del presupuesto acá</b><span>o tocá para elegirlo</span></div>
<input type="file" id="file" accept="application/pdf" hidden>
<div id="msg"></div>

<div id="app" style="display:none">
  <div class="seg np">
    <button data-mode="visita" class="on">Paga cada vez que viene</button>
    <button data-mode="cuotas">Entrega + cuotas fijas</button>
  </div>

  <div class="ctr np" id="cVisita">
    <div class="f"><label>Entrega hoy</label><input type="number" id="down" value="0" step="50" min="0"></div>
    <div class="f"><label>Techo por mes</label><input type="number" id="cap" value="0" step="25" min="0"></div>
  </div>

  <div class="ctr np" id="cCuotas" style="display:none">
    <div class="f"><label>Entrega hoy</label><input type="number" id="ent" value="0" step="100" min="0"></div>
    <div class="f"><label>Nº de cuotas</label><input type="number" id="nq" value="5" step="1" min="1" max="60"></div>
    <div class="f"><label>Cuota</label><input type="number" id="cq" value="0" step="0.01" min="0" class="auto"></div>
    <div class="f"><label>Empiezan en mes</label><input type="number" id="q1" value="2" step="1" min="1" max="12"></div>
  </div>

  <div class="board" id="board"></div>
  <div class="mm np">
    <button id="less" title="Quitar el último mes">&minus;</button>
    <button id="more" title="Agregar un mes">+</button>
    <span id="mmTxt"></span>
  </div>
  <div class="say" id="say"></div>
  <div id="warn"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=i=>document.getElementById(i);
const eur=n=>n.toLocaleString('es-ES',{maximumFractionDigits:0})+' €';
const eur2=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const num=s=>{s=String(s).trim();if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s)||0};
let tx=[],nMonths=6,uid=1,mode='visita',cqTouched=false;

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function readPDF(file){
  $('msg').innerHTML='<div class="info">Leyendo…</div>';
  try{
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let rows=[],meta='';
    for(let p=1;p<=pdf.numPages;p++){
      const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1}),W=vp.width;
      const items=(await pg.getTextContent()).items.filter(i=>i.str.trim())
        .map(i=>({x:i.transform[4]/W,top:vp.height-i.transform[5],s:i.str.trim()}));
      meta+=' '+items.map(i=>i.s).join(' ');
      items.sort((a,b)=>a.top-b.top);
      let cur=[];
      items.forEach(i=>{if(cur.length&&i.top-cur[cur.length-1].top>5){rows.push(cur);cur=[]}cur.push(i)});
      if(cur.length)rows.push(cur);
    }
    const pm=meta.match(/Nombre\s*:\s*([A-ZÁÉÍÓÚÑ][^:]*?)\s+DNI/i);
    $('who').textContent=pm?pm[1].trim():'';
    const rs=parseRows(rows);
    if(!rs.length){err('No encontré tratamientos en ese PDF.');return}
    tx=rs.map(r=>({id:uid++,n:r.n,pz:r.pz,p:r.dto!==null?r.dto:r.full,m:0,k:kind(r.n)}));
    if(tx.some(t=>t.k==='impl'))tx.forEach(t=>{if(t.k==='corona')t.m=4});
    nMonths=Math.max(6,Math.max(...tx.map(t=>t.m))+2);
    $('msg').innerHTML='';$('load').style.display='none';$('app').style.display='block';
    $('reload').style.display='';$('print').style.display='';
    cqTouched=false;render();
  }catch(e){err('No pude leer el PDF: '+e.message)}
}
const err=t=>$('msg').innerHTML='<div class="warn">'+t+'</div>';

function parseRows(rows){
  const out=[];
  for(const r0 of rows){
    const r=[...r0].sort((a,b)=>a.x-b.x);
    const txt=r.map(w=>w.s).join(' ');
    if(/^\s*(subtotal|total|dto\.)/i.test(txt))break;
    if(/página\s+\d+\s+de/i.test(txt))continue;
    const code=r.filter(w=>w.x<0.155).map(w=>w.s).join('');
    const name=r.filter(w=>w.x>=0.18&&w.x<0.52).map(w=>w.s).join(' ').trim();
    const pz=r.filter(w=>w.x>=0.52&&w.x<0.57).map(w=>w.s).join('').trim();
    const right=r.filter(w=>w.x>=0.57).map(w=>w.s).join(' ');
    const money=[...right.matchAll(/([\d.,]+)\s*€/g)].map(m=>num(m[1]));
    const pct=/(\d+)\s*%/.test(right);
    if(/^\d{3,6}$/.test(code)&&money.length)
      out.push({code,n:name,pz:/^\d{1,2}$/.test(pz)?pz:'',full:money[0],dto:pct?money[money.length-1]:null});
    else if(name&&!code&&out.length&&!money.length)out[out.length-1].n+=' '+name;
  }
  return out;
}
function kind(n){n=n.toLowerCase();
  if(/corona.*implante/.test(n))return'corona';
  if(/implante|multi ?unit|pilar/.test(n))return'impl';return'x'}

const total=()=>tx.reduce((s,x)=>s+x.p,0);

function autoCuota(){
  if(cqTouched)return;
  const n=+$('nq').value||1,e=+$('ent').value||0;
  $('cq').value=Math.max(0,(total()-e)/n).toFixed(2);
}

function calc(){
  const t=new Array(nMonths).fill(0),done=new Array(nMonths).fill(0);
  tx.forEach(x=>{if(x.m<nMonths)done[x.m]+=x.p});
  if(mode==='visita'){
    const d=+$('down').value||0;
    for(let m=0;m<nMonths;m++)t[m]=done[m];
    let rest=d;
    for(let i=0;i<nMonths&&rest>0;i++){const q=Math.min(rest,t[i]);t[i]-=q;rest-=q}
    if(d>0)t[0]+=d;
  }else{
    const e=+$('ent').value||0,n=+$('nq').value||0,c=+$('cq').value||0,s=Math.max(1,+$('q1').value||1)-1;
    if(e>0)t[0]+=e;
    for(let i=0;i<n;i++){const m=s+i;if(m<nMonths)t[m]+=c}
  }
  const paid=[],deliv=[];let a=0,b=0;
  for(let m=0;m<nMonths;m++){a+=t[m];b+=done[m];paid.push(a);deliv.push(b)}
  return{t,done,paid,deliv};
}

function render(){
  autoCuota();
  const c1=calc(),t=c1.t,paid=c1.paid,deliv=c1.deliv;
  const cap=+$('cap').value||0;
  const n=+$('nq').value||0,s=Math.max(1,+$('q1').value||1)-1,c=+$('cq').value||0,e=+$('ent').value||0;
  let h='';
  for(let m=0;m<nMonths;m++){
    const items=tx.filter(x=>x.m===m);
    const hi=mode==='visita'&&cap>0&&t[m]>cap+.5;
    let sub='';
    if(mode==='cuotas'){
      if(m===0&&e>0)sub='Entrega';
      else if(m>=s&&m<s+n)sub='Cuota '+(m-s+1)+' de '+n;
    }
    let st='';
    if(items.length){
      const dif=deliv[m]-paid[m];
      st=dif>0.5
        ?'<div class="st bad"><span>Faltan</span><span>'+eur(dif)+'</span></div>'
        :'<div class="st ok"><span>Cubierto</span><span>+'+eur(-dif)+'</span></div>';
    }
    h+='<div class="col" data-m="'+m+'">'+
      '<div class="ch"><div class="m">'+(m===0?'Hoy · Mes 1':'Mes '+(m+1))+'</div>'+
      '<div class="t '+(t[m]<.5?'zero':'')+' '+(hi?'hi':'')+'">'+(t[m]<.5?'—':(mode==='cuotas'?eur2(t[m]):eur(t[m])))+'</div>'+
      (sub?'<div class="k">'+sub+'</div>':'')+'</div><div class="body">'+
      items.map(function(x){return '<div class="chip" draggable="true" data-id="'+x.id+'">'+
        '<div class="nm"><b>'+x.n+(x.pz?' · '+x.pz:'')+'</b><i>'+eur(x.p)+'</i></div>'+
        '<div class="ar"><button data-a="l">&lsaquo;</button><button data-a="r">&rsaquo;</button></div></div>'}).join('')+
      (items.length?'':'<div class="empty">sin tratamiento</div>')+st+'</div></div>';
  }
  $('board').innerHTML=h;bind();
  const lastUsed=tx.length?Math.max.apply(null,tx.map(x=>x.m)):0;
  const lastQ=(mode==='cuotas'&&n)?s+n-1:0;
  const minM=Math.max(2,lastUsed+1,lastQ+1);
  $('less').disabled=nMonths<=minM;
  $('mmTxt').textContent=nMonths+' meses';

  const tot=total(),plan=t.reduce(function(a,b){return a+b},0);
  const pasos=[];
  for(let m=0;m<nMonths;m++){
    const it=tx.filter(x=>x.m===m);
    if(it.length)pasos.push('<b style="font-size:13px">Mes '+(m+1)+'</b> — '+[...new Set(it.map(x=>x.n))].join(', '));
  }
  if(mode==='cuotas'){
    $('say').innerHTML='<p>Entrega de <b>'+eur(e)+'</b> y '+n+' cuotas de <b>'+eur2(c)+'</b>.</p>'+
      '<div class="sub">'+pasos.join('<br>')+'<br><span style="opacity:.7">Tratamiento '+eur2(tot)+' · Plan '+eur2(plan)+'</span></div>';
  }else{
    $('say').innerHTML='<p>Empieza pagando <b>'+eur(t[0]||0)+'</b> y después paga cada vez que viene.</p>'+
      '<div class="sub">'+pasos.join('<br>')+'<br><span style="opacity:.7">Tratamiento completo '+eur2(tot)+'</span></div>';
  }

  let w='';const gaps=[];
  for(let m=0;m<nMonths;m++)if(tx.some(x=>x.m===m)&&deliv[m]-paid[m]>0.5)gaps.push({m:m,d:deliv[m]-paid[m]});
  if(gaps.length)w+='<div class="warn">En '+gaps.map(g=>'el mes '+(g.m+1)).join(', ')+
    ' se hace más tratamiento del que está pagado. La diferencia mayor es de <b>'+
    eur(Math.max.apply(null,gaps.map(g=>g.d)))+'</b>. Movés esos tratamientos más adelante, subís la entrega o achicás el plazo.</div>';
  if(mode==='cuotas'){
    const dif=plan-tot;
    if(Math.abs(dif)>1)w+='<div class="info">El plan '+(dif>0?'cobra <b>'+eur2(dif)+'</b> por encima del presupuesto':'queda <b>'+eur2(-dif)+'</b> por debajo del presupuesto')+' ('+eur2(tot)+').</div>';
    if(n&&s+n>nMonths)w+='<div class="info">Las cuotas siguen más allá del último mes del tablero. Agregá meses con el botón +.</div>';
  }
  $('warn').innerHTML=w;
}

function move(id,d){const x=tx.find(a=>a.id==id);x.m=Math.max(0,Math.min(59,x.m+d));
  if(x.m>=nMonths)nMonths=x.m+1;render()}
function bind(){
  $('board').querySelectorAll('.chip .ar button').forEach(function(b){
    b.onclick=function(ev){ev.stopPropagation();move(b.closest('.chip').dataset.id,b.dataset.a==='r'?1:-1)}});
  let dragId=null;
  $('board').querySelectorAll('.chip').forEach(function(cc){
    cc.ondragstart=function(ev){dragId=cc.dataset.id;cc.classList.add('drag');ev.dataTransfer.effectAllowed='move'};
    cc.ondragend=function(){cc.classList.remove('drag')}});
  $('board').querySelectorAll('.col').forEach(function(col){
    col.ondragover=function(ev){ev.preventDefault();col.classList.add('hot')};
    col.ondragleave=function(){col.classList.remove('hot')};
    col.ondrop=function(ev){ev.preventDefault();col.classList.remove('hot');
      if(dragId){tx.find(a=>a.id==dragId).m=+col.dataset.m;dragId=null;render()}}});
}

document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');mode=b.dataset.mode;
  $('cVisita').style.display=mode==='visita'?'flex':'none';
  $('cCuotas').style.display=mode==='cuotas'?'flex':'none';
  render()}});
['down','cap','q1'].forEach(i=>$(i).addEventListener('input',render));
['ent','nq'].forEach(i=>$(i).addEventListener('input',function(){cqTouched=false;render()}));
$('cq').addEventListener('input',function(){cqTouched=true;render()});
$('more').onclick=function(){if(nMonths<60){nMonths++;render()}};
$('less').onclick=function(){if(!$('less').disabled){nMonths--;render()}};
$('load').onclick=function(){$('file').click()};
$('file').onchange=function(e){if(e.target.files[0])readPDF(e.target.files[0])};
['dragover','dragenter'].forEach(ev=>$('load').addEventListener(ev,function(e){e.preventDefault();$('load').classList.add('on')}));
['dragleave','drop'].forEach(ev=>$('load').addEventListener(ev,function(e){e.preventDefault();$('load').classList.remove('on')}));
$('load').addEventListener('drop',function(e){const f=e.dataTransfer.files[0];if(f)readPDF(f)});
$('reload').onclick=function(){tx=[];cqTouched=false;$('app').style.display='none';$('load').style.display='';
  $('who').textContent='';$('reload').style.display='none';$('print').style.display='none'};
$('print').onclick=function(){window.print()};
</script>
</body>
</html>
